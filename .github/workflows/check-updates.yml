name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          echo "::group::Arch Linux Package Installation Logs"
          pacman -Syu --noconfirm pacman-contrib git curl jq
          echo "::endgroup::"

      - name: Set Safe Git Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Auto Update Script
        run: |
          chmod +x auto-update.sh
          ./auto-update.sh

      - name: Commit and Push Changes
        run: |
          # Ana depo dizinine geri dönüldüğünden emin ol
          cd "$GITHUB_WORKSPACE"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            echo -e "\n::group::Updated and Committed Files"
            git status --short
            echo "::endgroup::"
            
            git add .
            git commit -m "chore(auto-update): update PKGBUILD versions"
            git push
            echo "::notice title=MesAR Auto Update::New package versions detected and pushed to repository!"
          else
            echo "::notice title=MesAR Auto Update::No updates found, repository is up to date."
          fi
