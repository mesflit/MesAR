name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ============================================================
      # RUN AUTO UPDATE INSIDE ARCH
      # ============================================================

      - name: Run Auto Update Script
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "MesAR PKGBUILD Auto Update"
          echo "=============================================="

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c '

              set -e

              echo "==> Installing Arch dependencies..."

              pacman -Syu --noconfirm \
                pacman-contrib \
                git \
                curl \
                jq \
                sudo

              echo "==> Creating builder user..."

              useradd \
                --create-home \
                --shell /bin/bash \
                builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                > /etc/sudoers.d/builder

              chmod 440 /etc/sudoers.d/builder

              echo "==> Preparing workspace..."

              chown -R builder:builder /workspace

              echo "==> Configuring Git..."

              sudo -u builder git config \
                --global user.name \
                "mesflit"

              sudo -u builder git config \
                --global user.email \
                "84642884+mesflit@users.noreply.github.com"

              sudo -u builder git config \
                --global --add safe.directory \
                /workspace

              echo "==> Running auto-update.sh..."

              sudo -u builder \
                bash /workspace/auto-update.sh

              echo "==> Removing generated archive files..."

              find /workspace \
                -type f \
                \( \
                  -name "*.pkg.tar.zst" \
                  -o -name "*.pkg.tar.zst.sig" \
                  -o -name "*.tar.zst" \
                \) \
                -delete

              echo "==> Archive cleanup completed."

              echo "==> Auto update completed."

            '

          echo "==> Restoring workspace ownership..."

          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

          echo "==> Workspace ownership restored."

      # ============================================================
      # FINAL SAFETY CLEANUP
      # ============================================================

      - name: Remove Generated Archives
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "==> Removing any remaining generated archives..."

          find . \
            -type f \
            \( \
              -name "*.pkg.tar.zst" \
              -o -name "*.pkg.tar.zst.sig" \
              -o -name "*.tar.zst" \
            \) \
            -delete

          echo "==> Archive cleanup completed."

      # ============================================================
      # CHECK CHANGES
      # ============================================================

      - name: Check for Changes
        id: changes
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "Git Status"
          echo "=============================================="

          git status --short

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "::notice title=MesAR Auto Update::Package updates detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "::notice title=MesAR Auto Update::No package updates found."
          fi

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "Committing Changes"
          echo "=============================================="

          git config user.name \
            "mesflit"

          git config user.email \
            "84642884+mesflit@users.noreply.github.com"

          echo "::group::Files to commit"

          git status --short

          echo "::endgroup::"

          git add .

          git commit \
            -m "chore(auto-update): update PKGBUILD versions"

          echo "==> Pushing changes..."

          git push

          echo "::notice title=MesAR Auto Update::Changes successfully pushed."
