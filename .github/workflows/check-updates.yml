name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ============================================================
      # RUN AUTO UPDATE INSIDE ARCH CONTAINER
      # ============================================================

      - name: Run Auto Update Script
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c '
              set -e

              echo "=============================================="
              echo "MesAR PKGBUILD Auto Update"
              echo "Arch Linux Environment"
              echo "=============================================="

              echo
              echo "==> Installing dependencies..."

              pacman -Syu --noconfirm \
                pacman-contrib \
                git \
                curl \
                jq \
                sudo

              echo
              echo "==> Creating builder user..."

              useradd \
                --create-home \
                --shell /bin/bash \
                builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                > /etc/sudoers.d/builder

              chmod 440 /etc/sudoers.d/builder

              echo
              echo "==> Preparing workspace..."

              chown -R builder:builder /workspace

              echo
              echo "==> Configuring Git..."

              sudo -u builder git config \
                --global user.name \
                "mesflit"

              sudo -u builder git config \
                --global user.email \
                "84642884+mesflit@users.noreply.github.com"

              sudo -u builder git config \
                --global --add safe.directory \
                /workspace

              echo
              echo "==> Running auto-update.sh..."

              chmod +x /workspace/auto-update.sh

              sudo -u builder \
                bash -c "
                  cd /workspace
                  ./auto-update.sh
                "

              echo
              echo "=============================================="
              echo "Auto Update Finished"
              echo "=============================================="
            '

      # ============================================================
      # CHECK CHANGES
      # ============================================================

      - name: Check for Changes
        id: changes
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "::group::Git Status"
          git status --short
          echo "::endgroup::"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=MesAR Auto Update::Changes detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=MesAR Auto Update::No updates found."
          fi

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          git config user.name "mesflit"
          git config user.email "84642884+mesflit@users.noreply.github.com"

          echo "::group::Files to commit"
          git status --short
          echo "::endgroup::"

          git add .

          git commit \
            -m "chore(auto-update): update PKGBUILD versions"

          git push

          echo "::notice title=MesAR Auto Update::Changes pushed successfully."
