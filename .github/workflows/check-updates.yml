name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          echo "::group::Arch Linux Package Installation Logs"

          pacman -Syu --noconfirm \
            pacman-contrib \
            git \
            curl \
            jq \
            sudo

          echo "::endgroup::"

      # ============================================================
      # CREATE BUILDER USER
      # ============================================================

      - name: Create Build User
        run: |
          useradd \
            --create-home \
            --shell /bin/bash \
            builder

          echo 'builder ALL=(ALL) NOPASSWD: ALL' \
            > /etc/sudoers.d/builder

          chmod 440 /etc/sudoers.d/builder

          chown -R builder:builder "$GITHUB_WORKSPACE"

      # ============================================================
      # CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |
          sudo -u builder git config \
            --global user.name \
            "mesflit"

          sudo -u builder git config \
            --global user.email \
            "84642884+mesflit@users.noreply.github.com"

          sudo -u builder git config \
            --global --add safe.directory \
            "$GITHUB_WORKSPACE"

          git config \
            --global --add safe.directory \
            "$GITHUB_WORKSPACE"

      # ============================================================
      # VERIFY REPOSITORY
      # ============================================================

      - name: Verify Git Repository
        run: |
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo
          echo "Git directory:"
          ls -la "$GITHUB_WORKSPACE/.git"

          echo
          echo "Current commit:"

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" rev-parse HEAD

      # ============================================================
      # RUN AUTO UPDATE
      # ============================================================

      - name: Run Auto Update Script
        run: |
          chmod +x "$GITHUB_WORKSPACE/auto-update.sh"

          echo "::group::MesAR Auto Update"

          sudo -u builder \
            bash -c "
              cd '$GITHUB_WORKSPACE'
              ./auto-update.sh
            "

          echo "::endgroup::"

      # ============================================================
      # CHECK CHANGES
      # ============================================================

      - name: Check for Changes
        id: changes
        run: |
          echo "::group::Git Status"

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" status --short

          echo "::endgroup::"

          if sudo -u builder \
            git -C "$GITHUB_WORKSPACE" diff --quiet
          then

            if sudo -u builder \
              git -C "$GITHUB_WORKSPACE" diff --cached --quiet
            then

              if [[ -z "$(
                sudo -u builder \
                git -C "$GITHUB_WORKSPACE" status --porcelain
              )" ]]; then

                echo "changed=false" >> "$GITHUB_OUTPUT"

                echo "::notice title=MesAR Auto Update::No updates found, repository is up to date."

                exit 0

              fi

            fi

          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "::notice title=MesAR Auto Update::Changes detected."

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Changes
        if: steps.changes.outputs.changed == 'true'

        run: |
          echo "::group::Updated Files"

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" status --short

          echo "::endgroup::"

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" add .

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" commit \
              -m "chore(auto-update): update PKGBUILD versions"

          echo "::group::Push Changes"

          sudo -u builder \
            git -C "$GITHUB_WORKSPACE" push

          echo "::endgroup::"

          echo "::notice title=MesAR Auto Update::New package versions detected and pushed to repository!"
