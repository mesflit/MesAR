name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ============================================================
      # RUN AUTO UPDATE IN ARCH
      # ============================================================

      - name: Run Auto Update Script
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "MesAR PKGBUILD Auto Update"
          echo "=============================================="

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c '

              set -e

              echo "==> Updating Arch package databases..."

              pacman -Syu --noconfirm \
                pacman-contrib \
                git \
                curl \
                jq \
                sudo

              echo "==> Creating non-root build user..."

              useradd \
                --create-home \
                --shell /bin/bash \
                builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                > /etc/sudoers.d/builder

              chmod 440 /etc/sudoers.d/builder

              echo "==> Preparing workspace..."

              chown -R builder:builder /workspace

              echo "==> Configuring Git..."

              sudo -u builder git config \
                --global user.name \
                "mesflit"

              sudo -u builder git config \
                --global user.email \
                "84642884+mesflit@users.noreply.github.com"

              sudo -u builder git config \
                --global --add safe.directory \
                /workspace

              echo "==> Running auto-update.sh..."

              chmod +x /workspace/auto-update.sh

              sudo -u builder \
                bash -c "
                  cd /workspace
                  ./auto-update.sh
                "

              echo "==> Auto update completed."

            '

      # ============================================================
      # CHECK CHANGES
      # ============================================================

      - name: Check for Changes
        id: changes
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "Git Status"
          echo "=============================================="

          git status --short

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "::notice title=MesAR Auto Update::Package updates detected."

          else
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "::notice title=MesAR Auto Update::No package updates found."

          fi

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "Committing Changes"
          echo "=============================================="

          git config user.name \
            "mesflit"

          git config user.email \
            "84642884+mesflit@users.noreply.github.com"

          git add .

          git commit \
            -m "chore(auto-update): update PKGBUILD versions"

          echo "==> Pushing changes..."

          git push

          echo "::notice title=MesAR Auto Update::Changes successfully pushed."
