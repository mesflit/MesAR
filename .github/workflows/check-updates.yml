name: MesAR PKGBUILD Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          echo "::group::Arch Linux Package Installation Logs"

          pacman -Syu --noconfirm \
            pacman-contrib \
            git \
            curl \
            jq \
            sudo

          echo "::endgroup::"

      - name: Create Builder User
        run: |
          useradd \
            --create-home \
            --shell /bin/bash \
            builder

          echo 'builder ALL=(ALL) NOPASSWD: ALL' \
            > /etc/sudoers.d/builder

          chmod 440 /etc/sudoers.d/builder

          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          sudo -u builder git config \
            --global --add safe.directory "$GITHUB_WORKSPACE"

          sudo -u builder git config \
            --global user.name \
            "mesflit"

          sudo -u builder git config \
            --global user.email \
            "84642884+mesflit@users.noreply.github.com"

      - name: Verify Checkout
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE"

          if [[ ! -d .git ]]; then
            echo "ERROR: Git repository was not checked out."
            ls -la
            exit 1
          fi

          git status --short

      - name: Run Auto Update Script
        run: |
          cd "$GITHUB_WORKSPACE"

          chmod +x auto-update.sh

          echo "::group::MesAR Auto Update"

          sudo -u builder \
            bash -c "
              cd '$GITHUB_WORKSPACE'
              ./auto-update.sh
            "

          echo "::endgroup::"

      - name: Commit and Push Changes
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "::group::Updated Files"

          git status --short

          echo "::endgroup::"

          if [[ -n "$(git status --porcelain)" ]]; then

            git add .

            git commit \
              -m "chore(auto-update): update PKGBUILD versions"

            git push

            echo "::notice title=MesAR Auto Update::New package versions detected and pushed to repository!"

          else

            echo "::notice title=MesAR Auto Update::No updates found, repository is up to date."

          fi
