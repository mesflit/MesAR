name: Build MesAR Repository

on:
  workflow_run:
    workflows:
      - "MesAR PKGBUILD Auto Update"
    types:
      - completed

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mesar-repository
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build MesAR packages

    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          pacman -Syu --noconfirm

          pacman -S --noconfirm \
            git \
            sudo \
            pacman-contrib \
            curl

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # BUILD USER
      # ============================================================

      - name: Configure build user
        run: |
          set -e

          echo "=============================================="
          echo "Creating builder user"
          echo "=============================================="

          useradd \
            --create-home \
            --shell /bin/bash \
            builder

          echo 'builder ALL=(ALL) NOPASSWD: ALL' \
            > /etc/sudoers.d/builder

          chmod 440 /etc/sudoers.d/builder

      # ============================================================
      # FIX WORKSPACE PERMISSIONS
      # ============================================================

      - name: Prepare workspace
        run: |
          set -e

          echo "=============================================="
          echo "Preparing workspace"
          echo "=============================================="

          chown -R builder:builder "$GITHUB_WORKSPACE"

          sudo -u builder git config \
            --global user.name \
            "mesflit"

          sudo -u builder git config \
            --global user.email \
            "84642884+mesflit@users.noreply.github.com"

          sudo -u builder git config \
            --global --add safe.directory \
            "$GITHUB_WORKSPACE"

      # ============================================================
      # FIND PACKAGES
      # ============================================================

      - name: Detect package directories
        run: |
          set -e

          echo "=============================================="
          echo "Detecting packages"
          echo "=============================================="

          : > /tmp/mesar-packages

          find "$GITHUB_WORKSPACE" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name PKGBUILD \
            -print |
          while read -r pkgbuild; do

            directory="$(dirname "$pkgbuild")"
            package_name="$(basename "$directory")"

            if [[ "$package_name" == *-git ]]; then
              echo "[SKIP] $package_name -> VCS package"
              continue
            fi

            echo "[FOUND] $package_name"

            echo "$directory" >> /tmp/mesar-packages

          done

          sort -u \
            /tmp/mesar-packages \
            -o /tmp/mesar-packages

          echo
          echo "=============================================="
          echo "Available MesAR packages"
          echo "=============================================="

          cat /tmp/mesar-packages || true

      # ============================================================
      # DETERMINE PACKAGES
      # ============================================================

      - name: Determine packages to build
        run: |
          set -e

          : > /tmp/mesar-changed

          echo "=============================================="
          echo "Determining packages to build"
          echo "=============================================="

          # --------------------------------------------------------
          # MANUAL BUILD
          # --------------------------------------------------------

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            echo "Manual build requested."

            cp \
              /tmp/mesar-packages \
              /tmp/mesar-changed

          # --------------------------------------------------------
          # AUTO UPDATE
          # --------------------------------------------------------

          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then

            echo "Auto-update workflow completed."

            # The updater may have modified one or more packages.
            # Building all stable packages guarantees repository
            # consistency.

            cp \
              /tmp/mesar-packages \
              /tmp/mesar-changed

          # --------------------------------------------------------
          # NORMAL PUSH
          # --------------------------------------------------------

          else

            echo "Normal push detected."

            # Safely determine the previous commit.
            #
            # If there is no parent commit, build everything.

            if git rev-parse HEAD^ >/dev/null 2>&1; then

              git diff \
                --name-only \
                HEAD^ HEAD |
              while read -r file; do

                directory="${file%%/*}"

                if [[ -f "$GITHUB_WORKSPACE/$directory/PKGBUILD" ]]; then

                  package_name="$(basename "$directory")"

                  if [[ "$package_name" == *-git ]]; then

                    echo "[SKIP] $package_name -> VCS package"

                  else

                    echo "$GITHUB_WORKSPACE/$directory" \
                      >> /tmp/mesar-changed

                  fi

                fi

              done

            else

              echo "No previous commit found."

              cp \
                /tmp/mesar-packages \
                /tmp/mesar-changed

            fi

          fi

          sort -u \
            /tmp/mesar-changed \
            -o /tmp/mesar-changed

          echo
          echo "=============================================="
          echo "Packages to build"
          echo "=============================================="

          cat /tmp/mesar-changed || true

      # ============================================================
      # PREPARE GH-PAGES
      # ============================================================

      - name: Prepare binary repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          echo "=============================================="
          echo "Preparing binary repository"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/binary-repo"

          if git ls-remote \
            --exit-code \
            --heads \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages \
            >/dev/null 2>&1; then

            echo "Existing gh-pages branch found."

            git clone \
              --branch gh-pages \
              --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_WORKSPACE/binary-repo"

          else

            echo "gh-pages branch does not exist."

            mkdir \
              "$GITHUB_WORKSPACE/binary-repo"

            cd \
              "$GITHUB_WORKSPACE/binary-repo"

            git init

            git branch \
              -M gh-pages

            git config \
              user.name \
              "mesflit"

            git config \
              user.email \
              "84642884+mesflit@users.noreply.github.com"

            touch .nojekyll

            git add .

            git commit \
              -m "chore(repo): initialize MesAR repository"

            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            git push origin gh-pages

          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/binary-repo/x86_64"

          touch \
            "$GITHUB_WORKSPACE/binary-repo/.nojekyll"

          chown -R \
            builder:builder \
            "$GITHUB_WORKSPACE/binary-repo"

      # ============================================================
      # BUILD PACKAGES
      # ============================================================

      - name: Build packages
        run: |
          set -e

          echo "=============================================="
          echo "Building packages"
          echo "=============================================="

          if [[ ! -s /tmp/mesar-changed ]]; then

            echo "No packages need rebuilding."

            exit 0

          fi

          while read -r directory; do

            [[ -z "$directory" ]] && continue

            package_name="$(basename "$directory")"

            if [[ "$package_name" == *-git ]]; then

              echo "[SAFETY SKIP] $package_name"

              continue

            fi

            echo
            echo "=================================================="
            echo "BUILDING: $package_name"
            echo "=================================================="

            chown -R \
              builder:builder \
              "$directory"

            sudo -u builder bash -c "
              cd '$directory'

              makepkg \
                --syncdeps \
                --noconfirm \
                --clean \
                --cleanbuild
            "

            echo
            echo "Copying package..."

            find "$directory" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -exec cp {} \
              "$GITHUB_WORKSPACE/binary-repo/x86_64/" \;

          done < /tmp/mesar-changed

      # ============================================================
      # REMOVE OLD VERSIONS
      # ============================================================

      - name: Remove old package versions
        run: |
          set -e

          echo "=============================================="
          echo "Removing old package versions"
          echo "=============================================="

          cd \
            "$GITHUB_WORKSPACE/binary-repo/x86_64"

          while read -r directory; do

            [[ -z "$directory" ]] && continue

            package_name="$(basename "$directory")"

            if [[ "$package_name" == *-git ]]; then
              continue
            fi

            PKGBASE="$(
              makepkg \
                --printsrcinfo \
                --dir "$directory" 2>/dev/null |
              awk '
                /^pkgbase = / {
                  print $3
                  exit
                }
              '
            )"

            if [[ -z "$PKGBASE" ]]; then
              echo "[WARNING] Could not determine pkgbase: $package_name"
              continue
            fi

            echo
            echo "Package: $PKGBASE"

            mapfile -t PACKAGES < <(
              ls -1t \
                "$PKGBASE"-*.pkg.tar.zst \
                2>/dev/null ||
                true
            )

            if (( ${#PACKAGES[@]} <= 1 )); then
              continue
            fi

            for ((i=1; i<${#PACKAGES[@]}; i++)); do

              old="${PACKAGES[$i]}"

              echo "Removing old package:"
              echo "$old"

              rm -f "$old"

            done

          done < /tmp/mesar-changed

      # ============================================================
      # REBUILD PACMAN DATABASE
      # ============================================================

      - name: Rebuild repository database
        run: |
          set -e

          echo "=============================================="
          echo "Rebuilding MesAR database"
          echo "=============================================="

          cd \
            "$GITHUB_WORKSPACE/binary-repo/x86_64"

          rm -f \
            mesar.db \
            mesar.db.tar.gz \
            mesar.files \
            mesar.files.tar.gz \
            mesar.db.tar.gz.old \
            mesar.files.tar.gz.old

          shopt -s nullglob

          packages=(
            *.pkg.tar.zst
          )

          if (( ${#packages[@]} == 0 )); then

            echo "ERROR: No packages found."

            exit 1

          fi

          echo
          echo "Packages in repository:"

          printf '%s\n' \
            "${packages[@]}"

          repo-add \
            mesar.db.tar.gz \
            "${packages[@]}"

          cp \
            mesar.db.tar.gz \
            mesar.db

          if [[ -f mesar.files.tar.gz ]]; then

            cp \
              mesar.files.tar.gz \
              mesar.files

          fi

      # ============================================================
      # INDEX
      # ============================================================

      - name: Create repository index
        run: |
          set -e

          cat > \
            "$GITHUB_WORKSPACE/binary-repo/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>MesAR</title>
          </head>

          <body>

            <h1>MesAR</h1>

            <p>
              Mesflit's Arch Repository
            </p>

            <p>
              <a href="x86_64/">
                Browse x86_64 repository
              </a>
            </p>

          </body>
          </html>
          EOF

      # ============================================================
      # PUBLISH GH-PAGES
      # ============================================================

      - name: Publish repository
        run: |
          set -e

          echo "=============================================="
          echo "Publishing MesAR"
          echo "=============================================="

          cd \
            "$GITHUB_WORKSPACE/binary-repo"

          git config \
            user.name \
            "mesflit"

          git config \
            user.email \
            "84642884+mesflit@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No repository changes."

          else

            echo
            echo "Changes to publish:"

            git status --short

            git commit \
              -m "chore(repo): update MesAR packages"

            git push origin gh-pages

            echo
            echo "=============================================="
            echo "MesAR repository published successfully"
            echo "=============================================="

          fi

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup workspace
        if: always()
        run: |
          chown -R \
            "$(id -u):$(id -g)" \
            "$GITHUB_WORKSPACE"
