name: Build MesAR Repository

on:
  workflow_run:
    workflows:
      - "MesAR PKGBUILD Auto Update"
    types:
      - completed

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mesar-repository
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build MesAR packages
    runs-on: ubuntu-latest

    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # RUN EVERYTHING INSIDE ARCH
      # ============================================================

      - name: Build MesAR repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=============================================="
          echo "MesAR Repository Builder"
          echo "=============================================="

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GH_TOKEN="$GH_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            archlinux:base-devel \
            bash -c '

              set -e

              echo
              echo "=============================================="
              echo "Installing dependencies"
              echo "=============================================="

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                git \
                sudo \
                pacman-contrib \
                curl

              echo
              echo "=============================================="
              echo "Creating builder user"
              echo "=============================================="

              useradd \
                --create-home \
                --shell /bin/bash \
                builder

              echo "builder ALL=(ALL) NOPASSWD: ALL" \
                > /etc/sudoers.d/builder

              chmod 440 /etc/sudoers.d/builder

              echo
              echo "=============================================="
              echo "Preparing workspace"
              echo "=============================================="

              chown -R builder:builder /workspace

              sudo -u builder git config \
                --global user.name \
                "mesflit"

              sudo -u builder git config \
                --global user.email \
                "84642884+mesflit@users.noreply.github.com"

              sudo -u builder git config \
                --global --add safe.directory \
                /workspace

              echo
              echo "=============================================="
              echo "Preparing binary repository"
              echo "=============================================="

              rm -rf /workspace/binary-repo

              if git ls-remote \
                --exit-code \
                --heads \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                gh-pages \
                >/dev/null 2>&1; then

                echo "Existing gh-pages branch found."

                git clone \
                  --branch gh-pages \
                  --single-branch \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  /workspace/binary-repo

              else

                echo "gh-pages branch does not exist."

                mkdir -p /workspace/binary-repo

                cd /workspace/binary-repo

                git init

                git checkout -b gh-pages

                git config user.name "mesflit"

                git config \
                  user.email \
                  "84642884+mesflit@users.noreply.github.com"

                touch .nojekyll

                git add .

                git commit \
                  -m "chore(repo): initialize MesAR repository"

                git remote add origin \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                git push origin gh-pages

                cd /workspace

              fi

              mkdir -p \
                /workspace/binary-repo/x86_64

              touch \
                /workspace/binary-repo/.nojekyll

              echo
              echo "=============================================="
              echo "Detecting packages"
              echo "=============================================="

              : > /tmp/mesar-packages

              find /workspace \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name PKGBUILD \
                -print \
                | while read -r pkgbuild; do

                  directory="$(dirname "$pkgbuild")"

                  package_name="$(basename "$directory")"

                  if [[ "$package_name" == *-git ]]; then

                    echo "[SKIP] $package_name -> VCS package"

                    continue

                  fi

                  echo "[FOUND] $package_name"

                  echo "$directory" \
                    >> /tmp/mesar-packages

                done

              sort -u \
                /tmp/mesar-packages \
                -o /tmp/mesar-packages

              echo
              echo "=============================================="
              echo "Packages available for MesAR"
              echo "=============================================="

              cat /tmp/mesar-packages || true

              echo
              echo "=============================================="
              echo "Determining packages to build"
              echo "=============================================="

              : > /tmp/mesar-changed

              # ----------------------------------------------------
              # MANUAL BUILD
              # ----------------------------------------------------

              if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

                echo "Manual build detected."
                echo "Building all non--git packages."

                cp \
                  /tmp/mesar-packages \
                  /tmp/mesar-changed

              # ----------------------------------------------------
              # AUTO UPDATE WORKFLOW
              # ----------------------------------------------------

              elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then

                echo "Auto-update workflow completed successfully."

                # The update workflow can change multiple PKGBUILDs.
                # Build every non--git package to guarantee that the
                # repository is synchronized with main.

                cp \
                  /tmp/mesar-packages \
                  /tmp/mesar-changed

              # ----------------------------------------------------
              # NORMAL PUSH
              # ----------------------------------------------------

              else

                echo "Normal push detected."

                git diff \
                  --name-only \
                  HEAD^ HEAD \
                  | while read -r file; do

                    directory="${file%%/*}"

                    if [[ -f "/workspace/$directory/PKGBUILD" ]]; then

                      package_name="$(basename "$directory")"

                      if [[ "$package_name" == *-git ]]; then

                        echo "[SKIP] $package_name -> VCS package"

                      else

                        echo "$directory" \
                          >> /tmp/mesar-changed

                      fi

                    fi

                  done

              fi

              sort -u \
                /tmp/mesar-changed \
                -o /tmp/mesar-changed

              echo
              echo "=============================================="
              echo "Packages to build"
              echo "=============================================="

              cat /tmp/mesar-changed || true

              # ====================================================
              # BUILD PACKAGES
              # ====================================================

              echo
              echo "=============================================="
              echo "Building packages"
              echo "=============================================="

              if [[ ! -s /tmp/mesar-changed ]]; then

                echo "No packages need rebuilding."

              else

                while read -r directory; do

                  [[ -z "$directory" ]] && continue

                  package_name="$(basename "$directory")"

                  if [[ "$package_name" == *-git ]]; then

                    echo
                    echo "[SAFETY SKIP] $package_name"

                    continue

                  fi

                  echo
                  echo "=================================================="
                  echo "BUILDING: $package_name"
                  echo "=================================================="

                  chown \
                    -R \
                    builder:builder \
                    "$directory"

                  sudo -u builder bash -c "
                    cd /workspace/$directory

                    makepkg \
                      --syncdeps \
                      --noconfirm \
                      --clean \
                      --cleanbuild
                  "

                  echo
                  echo "Copying package files..."

                  find "$directory" \
                    -maxdepth 1 \
                    -type f \
                    -name "*.pkg.tar.zst" \
                    -exec cp {} /workspace/binary-repo/x86_64/ \;

                done < /tmp/mesar-changed

              fi

              # ====================================================
              # REMOVE OLD PACKAGE VERSIONS
              # ====================================================

              echo
              echo "=============================================="
              echo "Removing old package versions"
              echo "=============================================="

              cd /workspace/binary-repo/x86_64

              while read -r directory; do

                [[ -z "$directory" ]] && continue

                package_name="$(basename "$directory")"

                if [[ "$package_name" == *-git ]]; then
                  continue
                fi

                PKGBASE="$(
                  makepkg \
                    --printsrcinfo \
                    --dir "/workspace/$directory" \
                    | awk '
                        /^pkgbase = / {
                          print $3
                          exit
                        }
                      '
                )"

                if [[ -z "$PKGBASE" ]]; then

                  echo "WARNING:"
                  echo "Could not determine pkgbase for $directory"

                  continue

                fi

                echo
                echo "Package base: $PKGBASE"

                mapfile -t PACKAGES < <(
                  ls -1t \
                    "$PKGBASE"-*.pkg.tar.zst \
                    2>/dev/null \
                    || true
                )

                if (( ${#PACKAGES[@]} <= 1 )); then
                  continue
                fi

                for ((i=1; i<${#PACKAGES[@]}; i++)); do

                  OLD="${PACKAGES[$i]}"

                  echo "Removing old version:"
                  echo "$OLD"

                  rm -f "$OLD"

                  rm -f "$OLD.sig"

                done

              done < /tmp/mesar-changed

              # ====================================================
              # REBUILD DATABASE
              # ====================================================

              echo
              echo "=============================================="
              echo "Building pacman repository database"
              echo "=============================================="

              cd /workspace/binary-repo/x86_64

              rm -f mesar.db
              rm -f mesar.db.tar.gz
              rm -f mesar.files
              rm -f mesar.files.tar.gz

              shopt -s nullglob

              PACKAGES=(
                *.pkg.tar.zst
              )

              if [[ ${#PACKAGES[@]} -eq 0 ]]; then

                echo "ERROR: No packages found."

                exit 1

              fi

              echo
              echo "Packages in repository:"

              printf "%s\n" "${PACKAGES[@]}"

              # IMPORTANT:
              # No GPG signing.
              # No --sign.
              # No private key.
              # No secret required.

              repo-add \
                mesar.db.tar.gz \
                "${PACKAGES[@]}"

              cp \
                mesar.db.tar.gz \
                mesar.db

              if [[ -f mesar.files.tar.gz ]]; then

                cp \
                  mesar.files.tar.gz \
                  mesar.files

              fi

              rm -f mesar.db.tar.gz.old
              rm -f mesar.files.tar.gz.old

              echo
              echo "=============================================="
              echo "Creating repository index"
              echo "=============================================="

              cat > /workspace/binary-repo/index.html <<EOF
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>MesAR</title>
              </head>

              <body>

                <h1>MesAR</h1>

                <p>
                  Mesflit Arch Repository
                </p>

                <ul>
                  <li>
                    <a href="x86_64/">
                      x86_64 Repository
                    </a>
                  </li>
                </ul>

              </body>
              </html>
              EOF

              echo
              echo "=============================================="
              echo "Preparing gh-pages"
              echo "=============================================="

              cd /workspace/binary-repo

              git config \
                user.name \
                "mesflit"

              git config \
                user.email \
                "84642884+mesflit@users.noreply.github.com"

              git add .

              if git diff --cached --quiet; then

                echo
                echo "No repository changes detected."

              else

                echo
                echo "Repository changes detected."

                git status --short

                git commit \
                  -m "chore(repo): update MesAR packages"

                git push origin gh-pages

                echo
                echo "=============================================="
                echo "MesAR repository published successfully"
                echo "=============================================="

              fi

            '

          echo
          echo "=============================================="
          echo "MesAR build workflow finished"
          echo "=============================================="

      # ============================================================
      # RESTORE WORKSPACE OWNERSHIP
      # ============================================================

      - name: Restore workspace permissions
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
